#!/usr/sbin/nft -f
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept

        # Only the Mac, only the Thunderbolt link, only the two remoteDisplay ports.
        iifname "thunderbolt0" ip saddr 10.0.0.2 udp dport { 5000, 5002 } accept
        iifname "thunderbolt0" ip saddr 10.0.0.2 icmp type echo-request accept

        # Extension point (the dev profile drops its SSH rule here).
        include "/etc/nftables.d/*.nft"
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}
