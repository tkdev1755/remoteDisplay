[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# non-free-firmware: amdgpu / i915 microcode.
Repositories=main,non-free-firmware
# Reproducible builds: the snapshot id lives in image/SNAPSHOT (read by scripts/build.sh, passed
# to mkosi as --snapshot). Leaving this line commented keeps it that way.
#Snapshot=

[Output]
# mkosi only builds the root tree; scripts/pack.sh turns it into the final disk
# image (squashfs loaded in RAM by live-boot, GRUB on a FAT32 partition).
Format=directory
ImageId=remotedisplay
Output=rootfs
OutputDirectory=mkosi.output

[Content]
Bootable=no
WithDocs=no
ExtraTrees=payload:/
PostInstallationScripts=mkosi.postinst.chroot
RemoveFiles=
        /var/cache/apt/*
        /var/lib/apt/lists/*
        /usr/share/man/*
        /usr/share/info/*
# intel-microcode: Apple's firmware ships an old CPU microcode; without an update the kernel falls
# back to its heaviest mitigations (PTI, IBRS, MDS clearing) and the network receive path
# costs about twice as much CPU as on Pop!_OS, which installs this package.
# SDL is not installed from Debian: the receiver ships its own pinned SDL 2.30.0
# (see scripts/inside-receiver.sh), which only needs libdrm/libgbm/EGL/GL and ALSA.
# libgl1 + libopengl0: SDL's "opengl" renderer dlopen()s libOpenGL.so.0 / libGL.so.1. Without
# them SDL silently falls back to a shader-less renderer and the panel stays black.
Packages=
        systemd
        systemd-sysv
        udev
        kmod
        iproute2
        nftables
        brightnessctl
        linux-image-amd64
        initramfs-tools
        live-boot
        live-boot-initramfs-tools
        firmware-amd-graphics
        firmware-intel-graphics
        intel-microcode
        libasound2t64
        libegl1
        libgles2
        libgl1
        libopengl0
        libgbm1
        libdrm2
        libgl1-mesa-dri
        libegl-mesa0
