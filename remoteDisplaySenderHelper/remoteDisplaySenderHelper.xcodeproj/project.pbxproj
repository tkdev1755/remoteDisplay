			shellPath = /bin/sh;
			shellScript = "# 1. Variables\nAPP_NAME=\"remoteDisplaySenderHelper.app\"\nAPP_PATH=\"${BUILT_PRODUCTS_DIR}/${APP_NAME}\"\nPKG_NAME=\"ThunderboltSender_Install.pkg\"\nPKG_DEST=\"${BUILT_PRODUCTS_DIR}/${PKG_NAME}\"\n\n# Dossiers temporaires\nSCRIPTS_DIR=\"${TARGET_TEMP_DIR}/pkg_scripts\"\nPAYLOAD_DIR=\"${TARGET_TEMP_DIR}/pkg_payload\"\n\necho \"📦 Preparing to build PKG...\"\n\n# On s'assure que l'app a bien été compilée\nif [ ! -d \"$APP_PATH\" ]; then\n    echo \"error: App not found at $APP_PATH\"\n    exit 1\nfi\n\n\nrm -rf \"$PAYLOAD_DIR\"\nmkdir -p \"$PAYLOAD_DIR\"\ncp -R \"$APP_PATH\" \"$PAYLOAD_DIR/\"\n\n# 3. CRÉATION DES SCRIPTS\nrm -rf \"$SCRIPTS_DIR\"\nmkdir -p \"$SCRIPTS_DIR\"\n\ncat << 'EOF' > \"$SCRIPTS_DIR/postinstall\"\n#!/bin/bash\necho \"Configuring Thunderbolt Network...\"\n\nTB_SERVICE=$(networksetup -listallnetworkservices | grep -i \"bridge0\" | head -n 1 | xargs)\nif [ -z \"$TB_SERVICE\" ]; then\n    TB_SERVICE=$(networksetup -listallnetworkservices | grep -i \"Thunderbolt\" | head -n 1 | xargs)\nfi\n\nif [ -n \"$TB_SERVICE\" ]; then\n    networksetup -setmanual \"$TB_SERVICE\" 10.0.0.2 255.255.255.0 10.0.0.1\n    networksetup -setMTU \"$TB_SERVICE\" 65518\nfi\n\n\nexit 0\nEOF\n\nchmod +x \"$SCRIPTS_DIR/postinstall\"\n\npkgbuild --root \"$PAYLOAD_DIR\" \\\n         --install-location \"/Applications\" \\\n         --scripts \"$SCRIPTS_DIR\" \\\n         --identifier \"com.tkapps.programs.remoteDisplaySenderHelper\" \\\n         --version \"1.0\" \\\n         --ownership recommended \\\n         \"$PKG_DEST\"\n\necho \"✅ PKG successfully built at: $PKG_DEST\"\n";
