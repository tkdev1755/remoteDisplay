<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>remoteDisplay latency counter</title>
<style>
  html, body { margin: 0; height: 100%; background: #202020; color: #ddd;
               font: 16px ui-monospace, Menlo, monospace; overflow: hidden; cursor: none; }
  #bar { display: grid; grid-template-columns: repeat(18, 1fr); gap: 0; height: 16vh; }
  #bar div { background: #000; border-right: 2px solid #202020; box-sizing: border-box; }
  #info { padding: 2vh 2vw; }
  #ms { font-size: 9vh; letter-spacing: .05em; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="info">
  <div id="ms">0</div>
  <div id="meta"></div>
  <div>Open this page full screen on BOTH displays (Mac and the one streamed to the iMac).
       Cells: 1 white reference, 1 black reference, then 16 bits of (Date.now() mod 65536) ms, MSB first.</div>
</div>
<script>
const cells = [];
const bar = document.getElementById('bar');
for (let i = 0; i < 18; i++) { const d = document.createElement('div'); bar.appendChild(d); cells.push(d); }
cells[0].style.background = '#fff';   // white reference
cells[1].style.background = '#000';   // black reference

const msEl = document.getElementById('ms'), metaEl = document.getElementById('meta');
let last = 0, frames = 0, t0 = performance.now();
function tick() {
  const v = Date.now() % 65536;
  for (let b = 0; b < 16; b++) cells[2 + b].style.background = ((v >> (15 - b)) & 1) ? '#fff' : '#000';
  msEl.textContent = v;
  frames++;
  const now = performance.now();
  if (now - t0 > 1000) {
    metaEl.textContent = 'rAF ' + (frames * 1000 / (now - t0)).toFixed(1) + ' Hz  |  ' + location.search;
    frames = 0; t0 = now;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
